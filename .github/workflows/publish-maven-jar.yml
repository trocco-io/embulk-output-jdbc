name: Publish Maven Jar

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-publish:
    name: Build + Publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Publish(GPR Maven)
        run: ./gradlew :embulk-output-jdbc:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
