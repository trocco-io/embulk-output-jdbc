name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  publish-maven:
    name: Publish Maven
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Publish(GPR Maven)
        run: ./gradlew :embulk-output-jdbc:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-gems:
    name: Publish Gems / ${{ matrix.subproject }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        subproject:
          - embulk-output-jdbc
          - embulk-output-mysql
          - embulk-output-postgresql
          - embulk-output-redshift
          - embulk-output-sqlserver
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Publish(GPR Ruby Gems)
        uses: trocco-io/push-gem-to-gpr-action@ece6ed69b9a93b30ff0dbc8bc995d4d647bdbada # v3
        with:
          language: java
          gradle-subproject: ${{ matrix.subproject }}
          gem-path: "./${{ matrix.subproject }}/build/gems/*.gem"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
