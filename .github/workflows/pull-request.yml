name: Pull Request

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize

jobs:
  pre-release-maven:
    name: Pre-Release (Maven)
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Publish(GPR Maven)
        run: ./gradlew :embulk-output-jdbc:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get version
        id: version
        run: echo "version=$(./gradlew -q :embulk-output-jdbc:properties | grep '^version:' | awk '{print $2}')" >> $GITHUB_OUTPUT
      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- pre-release-maven -->"
      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- pre-release-maven -->
            ### Pre-Release: Maven
            Published `io.trocco:embulk-output-jdbc:${{ steps.version.outputs.version }}` to GitHub Packages.

  pre-release-gems:
    name: Pre-Release (Gems) / ${{ matrix.subproject }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        subproject:
          - embulk-output-jdbc
          - embulk-output-mysql
          - embulk-output-postgresql
          - embulk-output-redshift
          - embulk-output-sqlserver
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build gem
        run: ./gradlew :${{ matrix.subproject }}:gem
      - name: Publish(GPR Ruby Gems)
        uses: trocco-io/push-gem-to-gpr-action@v2
        with:
          language: java
          gem-path: "./${{ matrix.subproject }}/build/gems/*.gem"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Get gem name
        id: gem
        run: echo "name=$(ls ./${{ matrix.subproject }}/build/gems/*.gem | xargs basename)" >> $GITHUB_OUTPUT
      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- pre-release-gem-${{ matrix.subproject }} -->"
      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- pre-release-gem-${{ matrix.subproject }} -->
            ### Pre-Release: Gem / ${{ matrix.subproject }}
            Published `${{ steps.gem.outputs.name }}` to GitHub Packages.
